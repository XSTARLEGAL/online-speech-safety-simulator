<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1680" viewBox="0 0 760 1680">
  <defs>
    <style>
      .bg{fill:#fbfffd}
      .ink{fill:#111827}
      .muted{fill:#51616b}
      .teal{fill:#078b82}
      .teal2{fill:#15a79b}
      .blue{fill:#0f5f86}
      .purple{fill:#6a55b8}
      .line{stroke:#078b82;stroke-width:2;fill:none}
      .dash{stroke:#078b82;stroke-width:1.4;stroke-dasharray:3 4;fill:none}
      .soft{fill:#ecfaf7}
      .soft2{fill:#f3fbff}
      .soft3{fill:#f6f3ff}
      .card{fill:#ffffff;stroke:#078b82;stroke-width:2}
      .card2{fill:#ffffff;stroke:#0f5f86;stroke-width:2}
      .card3{fill:#ffffff;stroke:#6a55b8;stroke-width:2}
      .title{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-weight:900}
      .txt{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif}
      .mono{font-family:Menlo,Consolas,monospace}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#006c66" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#078b82"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="760" height="1680"/>

  <!-- pixel circuit corners -->
  <path class="line" d="M32 38 h36 v8 h28 M32 38 v34 h-8 v28 M676 38 h52 v54 M676 38 v8 h-26 M728 92 h-26"/>
  <path class="line" d="M31 154 h24 v-18 h32 M704 154 h-28 v-18 h-32"/>
  <circle cx="96" cy="46" r="3" fill="#078b82"/><circle cx="650" cy="46" r="3" fill="#078b82"/>
  <circle cx="87" cy="136" r="3" fill="#078b82"/><circle cx="644" cy="136" r="3" fill="#078b82"/>

  <!-- Header -->
  <g transform="translate(0,0)">
    <text x="380" y="72" text-anchor="middle" class="title ink" font-size="24">有点智能事务所</text>
    <g transform="translate(239,42)">
      <path d="M18 0 C7 0 0 8 0 18 c0 9 6 14 10 18 v9 h16 v-9 c5-4 10-9 10-18 C36 8 29 0 18 0Z" fill="#111827"/>
      <rect x="10" y="48" width="16" height="5" fill="#111827"/>
      <rect x="12" y="56" width="12" height="4" fill="#111827"/>
    </g>
    <text x="86" y="160" class="title teal" font-size="76">#</text>
    <text x="172" y="154" class="title ink" font-size="56">网络发言</text>
    <text x="92" y="230" class="title teal" font-size="64">安全检测器</text>
    <text x="486" y="230" class="title ink" font-size="64">Skill</text>
    <rect x="50" y="258" width="660" height="42" rx="21" fill="#078b82"/>
    <text x="380" y="286" text-anchor="middle" class="title" fill="#fff" font-size="24">先判断模式，再做七项检查，最后给出改写和行动建议</text>
  </g>

  <!-- Slogan box -->
  <g filter="url(#shadow)">
    <rect x="62" y="326" width="636" height="88" rx="22" fill="#fff" stroke="#078b82" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="132" cy="370" r="26" fill="#16a394"/>
    <text x="132" y="383" text-anchor="middle" class="title" fill="#fff" font-size="38">!</text>
    <text x="190" y="362" class="title ink" font-size="26">该说的话说出来，</text>
    <text x="190" y="395" class="title ink" font-size="26">把不必要的麻烦降下去。</text>
  </g>

  <!-- Main flow title -->
  <g transform="translate(0,445)">
    <rect x="300" y="0" width="160" height="38" rx="8" fill="#078b82"/>
    <text x="380" y="27" text-anchor="middle" class="title" fill="#fff" font-size="22">真实分析流程</text>
  </g>

  <!-- top flow -->
  <g transform="translate(34,505)">
    <rect class="card" x="0" y="0" width="692" height="162" rx="10" filter="url(#shadow)"/>

    <g transform="translate(28,34)">
      <rect x="0" y="0" width="44" height="44" rx="6" fill="#078b82"/>
      <text x="22" y="31" text-anchor="middle" class="title" fill="#fff" font-size="26">1</text>
      <text x="64" y="18" class="title ink" font-size="20">材料进入</text>
      <text x="64" y="48" class="txt muted" font-size="16">粘贴文字 / 上传材料</text>
      <text x="64" y="75" class="txt muted" font-size="16">平台、场景、受众先说清</text>
    </g>

    <path d="M188 82 h48" class="line" marker-end="url(#arrow)"/>

    <g transform="translate(252,34)">
      <rect x="0" y="0" width="44" height="44" rx="6" fill="#0f5f86"/>
      <text x="22" y="31" text-anchor="middle" class="title" fill="#fff" font-size="26">2</text>
      <text x="64" y="18" class="title ink" font-size="20">模式判断</text>
      <text x="64" y="48" class="txt muted" font-size="16">Mode A：发帖前</text>
      <text x="64" y="75" class="txt muted" font-size="16">Mode B：已争议/律师函</text>
    </g>

    <path d="M418 82 h48" class="line" marker-end="url(#arrow)"/>

    <g transform="translate(482,34)">
      <rect x="0" y="0" width="44" height="44" rx="6" fill="#6a55b8"/>
      <text x="22" y="31" text-anchor="middle" class="title" fill="#fff" font-size="26">3</text>
      <text x="64" y="18" class="title ink" font-size="20">报告输出</text>
      <text x="64" y="48" class="txt muted" font-size="16">风险等级 + 七项表</text>
      <text x="64" y="75" class="txt muted" font-size="16">责任层次 + 改写建议</text>
    </g>
  </g>

  <!-- Section 1 -->
  <g transform="translate(34,710)">
    <rect class="card" x="0" y="0" width="692" height="216" rx="10" filter="url(#shadow)"/>
    <rect x="18" y="18" width="42" height="54" rx="5" fill="#078b82"/>
    <text x="39" y="56" text-anchor="middle" class="title" fill="#fff" font-size="32">1</text>
    <text x="78" y="40" class="title ink" font-size="24">先补齐事实</text>
    <rect x="78" y="54" width="160" height="28" rx="5" class="soft"/>
    <text x="92" y="74" class="title teal" font-size="16">不知道，就先问清楚</text>
    <text x="34" y="122" class="txt ink" font-size="18">不是直接下结论，</text>
    <text x="34" y="150" class="txt ink" font-size="18">先把判断所需事实补齐。</text>

    <g transform="translate(254,36)">
      <rect x="0" y="0" width="400" height="142" rx="8" fill="#fff" stroke="#b6deda" stroke-dasharray="4 3"/>
      <g transform="translate(18,18)">
        <rect x="0" y="0" width="72" height="96" rx="8" class="soft"/><text x="36" y="40" text-anchor="middle" font-size="28">💬</text><text x="36" y="78" text-anchor="middle" class="txt ink" font-size="14">原文</text>
        <rect x="88" y="0" width="72" height="96" rx="8" class="soft"/><text x="124" y="40" text-anchor="middle" font-size="28">📍</text><text x="124" y="78" text-anchor="middle" class="txt ink" font-size="14">平台</text>
        <rect x="176" y="0" width="72" height="96" rx="8" class="soft"/><text x="212" y="40" text-anchor="middle" font-size="28">👥</text><text x="212" y="78" text-anchor="middle" class="txt ink" font-size="14">受众</text>
        <rect x="264" y="0" width="72" height="96" rx="8" class="soft"/><text x="300" y="40" text-anchor="middle" font-size="28">🧾</text><text x="300" y="78" text-anchor="middle" class="txt ink" font-size="14">证据</text>
      </g>
    </g>
  </g>

  <!-- Section 2 -->
  <g transform="translate(34,954)">
    <rect class="card2" x="0" y="0" width="692" height="258" rx="10" filter="url(#shadow)"/>
    <rect x="18" y="18" width="42" height="54" rx="5" fill="#0f5f86"/>
    <text x="39" y="56" text-anchor="middle" class="title" fill="#fff" font-size="32">2</text>
    <text x="78" y="40" class="title ink" font-size="24">七项检查</text>
    <rect x="78" y="54" width="184" height="28" rx="5" class="soft2"/>
    <text x="92" y="74" class="title blue" font-size="16">逐项拆风险，不一刀切</text>
    <text x="34" y="122" class="txt ink" font-size="18">同一句话，风险可能不在骂人，</text>
    <text x="34" y="150" class="txt ink" font-size="18">而在事实定性、个人信息和传播。</text>

    <g transform="translate(254,32)">
      <rect x="0" y="0" width="400" height="190" rx="8" fill="#fff" stroke="#c0d9e8" stroke-dasharray="4 3"/>
      <g class="txt ink" font-size="15">
        <rect x="18" y="18" width="106" height="44" rx="8" class="soft2"/><text x="71" y="46" text-anchor="middle">1 侮辱语言</text>
        <rect x="142" y="18" width="106" height="44" rx="8" class="soft2"/><text x="195" y="46" text-anchor="middle">2 事实/观点</text>
        <rect x="266" y="18" width="106" height="44" rx="8" class="soft2"/><text x="319" y="46" text-anchor="middle">3 隐私信息</text>
        <rect x="18" y="76" width="106" height="44" rx="8" class="soft2"/><text x="71" y="104" text-anchor="middle">4 肖像照片</text>
        <rect x="142" y="76" width="106" height="44" rx="8" class="soft2"/><text x="195" y="104" text-anchor="middle">5 传播范围</text>
        <rect x="266" y="76" width="106" height="44" rx="8" class="soft2"/><text x="319" y="104" text-anchor="middle">6 刑事门槛</text>
        <rect x="82" y="134" width="236" height="44" rx="8" class="soft2"/><text x="200" y="162" text-anchor="middle">7 场景与减轻/加重因素</text>
      </g>
    </g>
  </g>

  <!-- Section 3 -->
  <g transform="translate(34,1240)">
    <rect class="card3" x="0" y="0" width="692" height="258" rx="10" filter="url(#shadow)"/>
    <rect x="18" y="18" width="42" height="54" rx="5" fill="#6a55b8"/>
    <text x="39" y="56" text-anchor="middle" class="title" fill="#fff" font-size="32">3</text>
    <text x="78" y="40" class="title ink" font-size="24">报告与改写</text>
    <rect x="78" y="54" width="160" height="28" rx="5" class="soft3"/>
    <text x="92" y="74" class="title purple" font-size="16">保留表达，降低风险</text>
    <text x="34" y="122" class="txt ink" font-size="18">保留批评和维权诉求，</text>
    <text x="34" y="150" class="txt ink" font-size="18">删除无证定性、隐私和扩散号召。</text>

    <g transform="translate(254,30)">
      <rect x="0" y="0" width="400" height="196" rx="8" fill="#fff" stroke="#d7ccff" stroke-dasharray="4 3"/>
      <g class="txt ink" font-size="15">
        <rect x="18" y="18" width="106" height="48" rx="8" class="soft3"/><text x="71" y="48" text-anchor="middle">风险等级</text>
        <rect x="142" y="18" width="106" height="48" rx="8" class="soft3"/><text x="195" y="48" text-anchor="middle">七项表格</text>
        <rect x="266" y="18" width="106" height="48" rx="8" class="soft3"/><text x="319" y="48" text-anchor="middle">三层责任</text>
        <rect x="18" y="82" width="106" height="48" rx="8" class="soft3"/><text x="71" y="112" text-anchor="middle">相似案例</text>
        <rect x="142" y="82" width="106" height="48" rx="8" class="soft3"/><text x="195" y="112" text-anchor="middle">安全改写</text>
        <rect x="266" y="82" width="106" height="48" rx="8" class="soft3"/><text x="319" y="112" text-anchor="middle">行动清单</text>
        <rect x="52" y="146" width="296" height="36" rx="8" fill="#fff8ec" stroke="#e5b35b"/>
        <text x="200" y="170" text-anchor="middle" fill="#8a5a00">Mode B 额外看：保存证据 + 控制传播</text>
      </g>
    </g>
  </g>

  <!-- risk strip -->
  <g transform="translate(34,1526)">
    <rect x="0" y="0" width="692" height="70" rx="10" fill="#fff" stroke="#078b82" stroke-width="2"/>
    <text x="30" y="43" class="title ink" font-size="22">风险等级</text>
    <rect x="154" y="18" width="118" height="36" rx="18" fill="#dff8ea"/>
    <text x="213" y="42" text-anchor="middle" class="title" fill="#0a7f3b" font-size="18">GREEN</text>
    <rect x="290" y="18" width="118" height="36" rx="18" fill="#fff3c4"/>
    <text x="349" y="42" text-anchor="middle" class="title" fill="#9a6a00" font-size="18">YELLOW</text>
    <rect x="426" y="18" width="118" height="36" rx="18" fill="#ffe0e0"/>
    <text x="485" y="42" text-anchor="middle" class="title" fill="#b42318" font-size="18">RED</text>
    <text x="580" y="42" class="txt muted" font-size="15">从“可发”到“别直接发”</text>
  </g>

  <!-- footer -->
  <g transform="translate(34,1620)">
    <rect x="0" y="0" width="692" height="42" rx="8" fill="#ecfaf7" stroke="#078b82" stroke-width="2"/>
    <text x="24" y="27" class="title ink" font-size="18">有点智能事务所</text>
    <text x="210" y="27" class="txt muted" font-size="15">网络表达风险 / AI 合规 / 数据合规 / Legal Skills</text>
  </g>
</svg>
